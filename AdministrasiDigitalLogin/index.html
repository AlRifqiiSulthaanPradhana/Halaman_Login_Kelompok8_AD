<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopiva - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span class="time">9:41</span>
    </div>

    <header class="brand">
      <div class="logo">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 8h13l-1 11.5a1.5 1.5 0 0 1-1.5 1.4H8a1.5 1.5 0 0 1-1.5-1.4L5.500 8z"/>
          <path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/>
          <path d="M9.500 14.500c.6 1 1.5 1.500 2.500 1.500s1.900-.5 2.500-1.500"/>
        </svg>
      </div>
      <h1>Shopiva</h1>
      <p class="tagline">Satu Aplikasi, Sejuta Pilihan</p>
      <span class="pill">SIMPLE. STYLISH. YOU.</span>
    </header>

    <section class="welcome">
      <h2>Selamat datang!</h2>
      <p>Masuk untuk mulai belanja favoritmu.</p>
    </section>

    <form class="form" onsubmit="return false;">
      <label for="username">Username</label>
      <div class="input">
        <svg class="icon-left" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.800"/>
          <path d="M4.500 20c0-3.700 3.400-6 7.500-6s7.500 2.300 7.500 6"/>
        </svg>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
      </div>

      <label for="password">Password</label>
      <div class="input">
        <svg class="icon-left" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="10.500" width="14" height="9.500" rx="2.500"/>
          <path d="M8.500 10.500V8a3.500 3.500 0 0 1 7 0v2.500"/>
          <circle cx="12" cy="15.200" r="1" fill="#2d5a45"/>
        </svg>
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
        <svg class="icon-right" id="toggle" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.600-6.500 10-6.500S22 12 22 12s-3.600 6.500-10 6.500S2 12 2 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>

      <button type="submit" class="btn">
        <span>Lanjutkan</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </form>

    <footer class="footer">
      <strong>Temukan Gayamu.</strong>
      <span>Pilihan simpel. Belanja lebih nyaman.</span>
    </footer>

  </div>

  <script>
   
    const pass = document.getElementById('password');
    document.getElementById('toggle').addEventListener('click', () => {
      pass.type = pass.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
