<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk – Absensi Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="kartu">
    <div class="kepala">
      <h1>Absensi Digital</h1>
      <p>Masuk untuk mencatat kehadiran Anda</p>
    </div>

    <form action="#" method="post">
      <div class="kolom">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="username" required>
      </div>

      <div class="kolom">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
      </div>

      <button type="submit">Masuk</button>

      <p class="bantuan">Lupa password? <a href="#">Hubungi admin</a></p>
    </form>
  </main>

</body>
</html>
